<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVN INFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0f17}
@media (prefers-color-scheme:light){html,body{background:#f4f6fa}}
body.light{background:#f4f6fa}
evninfo-page{display:block;height:100dvh;--hp-h:100dvh}
.st{position:fixed;right:14px;bottom:14px;z-index:5;font:500 13px/1 "Be Vietnam Pro",system-ui,sans-serif;padding:8px 13px;border-radius:999px;
  text-decoration:none;color:#38c6f4;background:rgba(20,27,40,.9);border:1px solid #243046;box-shadow:0 2px 8px rgba(0,0,0,.25)}
body.light .st{color:#1e6fd9;background:rgba(255,255,255,.95);border-color:#e6e9ef}
</style></head>
<body>
<evninfo-page></evninfo-page>
<a class="st" href="status.html">Trạng thái · cập nhật</a>
<script type="module">
// Trang ingress của add-on: dùng lại giao diện "Điện EVN" (evn.js), đọc JSON của chính add-on (đường dẫn tương đối)
await import('./evn.js');
const Base = customElements.get('hp-evn-panel');
class EvnInfoPage extends Base {
  static ADDON = ['evninfo', 'EVN INFO']; static TITLE = 'Điện EVN'; static KEY = 'evninfo-';
  async _ingress() { this._src = { slug: 'evninfo', label: 'EVN INFO' }; this._base = '.'; }
}
customElements.define('evninfo-page', EvnInfoPage);
const el = document.querySelector('evninfo-page');
const dark = () => { try { const t = localStorage.getItem('hp-theme'); if (t) return t !== 'light'; } catch (_) {} return matchMedia('(prefers-color-scheme: dark)').matches; };
el.narrow = false; el.panel = {};
el.hass = { themes: { darkMode: dark() } };
document.body.classList.toggle('light', !dark());
</script>
</body></html>
