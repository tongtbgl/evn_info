# Add-on EVN INFO – lấy dữ liệu điện từ CSKH EVN, thay add-on EVN VN (smarthomeblack) đã ngừng phát hành.
# Lấy dữ liệu từ CSKH EVN miền Trung (cskh-api.cpc.vn): sản lượng theo ngày, hóa đơn theo tháng, tiền nợ, lịch cắt điện.
name: EVN INFO
version: "1.1.0"
slug: evninfo
description: Sản lượng / hóa đơn / tiền nợ / lịch cắt điện từ CSKH EVN miền Trung – lưu lịch sử, tạo sensor
url: "https://github.com/GITHUB_USER/evninfo-addon"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: EVN INFO
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
    path: /haconfig
options:
  username: ""
  password: ""
  interval_minutes: 180
  bill_years: 3
  import_evnvn: true
  sensors: true
schema:
  username: str
  password: password
  interval_minutes: int(30,1440)
  bill_years: int(1,10)
  import_evnvn: bool
  sensors: bool
